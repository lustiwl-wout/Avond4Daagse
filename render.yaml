services:
  - type: web
    name: avond4daagse-routeplanner
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false # plak hier je Neon-connectiestring in het Render-dashboard
      - key: GOOGLE_MAPS_API_KEY
        sync: false # Google Maps browser-key (website-restrictie), voor de kaarten op de site
      - key: ADMIN_PASSWORD
        sync: false # master-wachtwoord van de platformbeheerder (werkt op elk event; optioneel)
      - key: BASE_DOMAIN
        sync: false # eigen domein voor subdomeinen per event, bv. a4droute.nl (optioneel)
      - key: ORS_API_KEY
        sync: false # gratis key van openrouteservice.org voor wandelroutes met eigen quotum (aanbevolen)
