services:
  - type: web
    name: avond4daagse-routeplanner
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false # plak hier je Neon-connectiestring in het Render-dashboard
      - key: GOOGLE_MAPS_API_KEY
        sync: false # Google Maps browser-key (website-restrictie), voor de kaarten op de site
      - key: ADMIN_PASSWORD
        sync: false # zelfgekozen wachtwoord voor de beheerpagina (/admin)
