<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avond4Daagse — Basisschool Syncope Almere</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🚶 Avond4Daagse</h1>
    <p>Basisschool Syncope · Almere</p>
  </header>

  <main>
    <aside id="sidebar">
      <section>
        <h2>Kies een dag</h2>
        <div id="day-tabs">
          <button class="day-tab active" data-day="all">Alle</button>
          <button class="day-tab" data-day="1">Dag 1</button>
          <button class="day-tab" data-day="2">Dag 2</button>
          <button class="day-tab" data-day="3">Dag 3</button>
          <button class="day-tab" data-day="4">Dag 4</button>
        </div>
      </section>

      <section>
        <h2>Routes</h2>
        <ul id="distance-list"><li class="hint">Laden…</li></ul>
      </section>

      <section>
        <h2>GPS — loop mee</h2>
        <p class="hint">Start de GPS om jezelf op de kaart te zien tijdens het lopen.</p>
        <button id="gps-start">📍 Start GPS</button>
        <button id="gps-stop" class="hidden">⏹ Stop GPS</button>
        <label id="follow-label" class="hidden">
          <input type="checkbox" id="follow-me" checked /> Kaart volgt mij
        </label>
        <p id="gps-status" class="hint"></p>
      </section>

      <section>
        <h2>Street View</h2>
        <p class="hint">Sleep het gele poppetje (rechtsonder op de kaart) op de route om de straat te bekijken.</p>
      </section>
    </aside>

    <div id="map-container">
      <div id="map"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
