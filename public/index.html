<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Avond4Daagse — Basisschool Syncope Almere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2a7 7 0 0 0-7 7c0 4.9 5.4 11.2 6.6 12.5a.55.55 0 0 0 .8 0C13.6 20.2 19 13.9 19 9a7 7 0 0 0-7-7z" fill="currentColor"/>
        <circle class="logo-dot" cx="12" cy="9" r="2.6"/>
      </svg>
      <div>
        <h1>Avond4Daagse</h1>
        <p class="sub">Basisschool Syncope · Almere</p>
      </div>
    </div>
    <a href="/verkeer" id="back-link">Verkeersregelaars</a>
  </header>

  <main>
    <aside id="sidebar">
      <section>
        <div id="day-tabs">
          <button class="day-tab active" data-day="all">Alle</button>
          <button class="day-tab" data-day="1">Dag 1</button>
          <button class="day-tab" data-day="2">Dag 2</button>
          <button class="day-tab" data-day="3">Dag 3</button>
          <button class="day-tab" data-day="4">Dag 4</button>
        </div>
      </section>

      <section>
        <div class="button-row">
          <button id="gps-start" class="primary">Start GPS</button>
          <button id="gps-stop" class="danger hidden">Stop GPS</button>
        </div>
        <label id="follow-label" class="hidden">
          <input type="checkbox" id="follow-me" checked /> Kaart volgt mij
        </label>
        <p id="gps-status" class="hint"></p>
      </section>

      <details id="info-details">
        <summary>Afstanden & uitleg</summary>
        <ul id="distance-list"><li class="hint">Laden…</li></ul>
        <p class="hint">
          Alle dagen starten en eindigen bij de start/finish-markering op de kaart. Sleep het gele
          poppetje (rechtsonder) op de route voor Street View.
        </p>
      </details>
    </aside>

    <div id="map-container">
      <div id="map"></div>
    </div>
  </main>

  <script src="gps.js"></script>
  <script src="app.js"></script>
</body>
</html>
